<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Studio</title>
<style>
:root{--bg:#121213;--pane:#1b1b1d;--pane2:#242427;--line:#303034;--ink:#ececee;--mute:#8e8e95;--acc:#f2b632;--ok:#3fb27f;--red:#e5484d;--ai:#a78bfa}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden;user-select:none}
button,input,select{font:inherit;color:inherit}
button{background:var(--pane2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
button:hover{border-color:#55555c}button:disabled{opacity:.45;cursor:default}
button.go{background:var(--acc);border-color:var(--acc);color:#1a1a1a;font-weight:600}
button.ghost{background:none;border-color:transparent;color:var(--mute);padding:4px 8px}button.ghost:hover{color:var(--ink)}
input{user-select:text}
/* top */
#top{flex:none;padding:14px 16px 8px;display:flex;flex-direction:column;align-items:center;gap:10px}
#sbox{position:relative;width:min(760px,100%)}
#q{width:100%;height:48px;font-size:17px;padding:0 104px 0 46px;border-radius:14px;background:var(--pane2);border:1px solid #3a3a40;outline:none}
#q:focus{border-color:var(--acc);box-shadow:0 0 0 3px #f2b63230}
#sbox .ic{position:absolute;left:16px;top:12px;font-size:19px;color:var(--mute);pointer-events:none}
#sbox .btns{position:absolute;right:7px;top:7px;display:flex;gap:4px}
#sbox .btns button{width:38px;height:34px;padding:0;border-radius:10px;font-size:16px;display:flex;align-items:center;justify-content:center}
#mic.rec{background:var(--red);border-color:var(--red);animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.55}}
#askb{border-color:#6d5bd0;color:#d9d0ff}
#chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:980px}
.chip{border-radius:99px;padding:4px 12px;font-size:13px;background:var(--pane);border:1px solid var(--line)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#1a1a1a;font-weight:600}
.chip.t{background:var(--pane2)}.sepv{width:1px;background:var(--line);margin:2px 4px}
#say{width:min(760px,100%);display:none;gap:8px;align-items:flex-start;background:#1d1b27;border:1px solid #3b3360;border-radius:10px;padding:8px 12px;font-size:13px;user-select:text}
#say.on{display:flex}#say .tx{flex:1;white-space:pre-wrap}
/* middle */
#mid{flex:1;min-height:0;display:flex;gap:0}
#res{flex:1;min-width:0;overflow:auto;padding:6px 16px 16px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.empty{color:var(--mute);text-align:center;padding:40px 16px;font-size:15px}
.card{position:relative;border-radius:10px;overflow:hidden;background:var(--pane);border:2px solid transparent;cursor:pointer}
.card.sel{border-color:var(--acc)}.card.dim{opacity:.55}
.card .th{aspect-ratio:1/1;background:#0b0b0c;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:26px}
.card .th img{width:100%;height:100%;object-fit:cover;pointer-events:none;display:block}
.card .nm{padding:5px 8px;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .tg{position:absolute;left:6px;top:6px;background:#000a;border-radius:6px;padding:1px 6px;font-size:11px}
.card .add{position:absolute;right:6px;bottom:32px;width:32px;height:32px;padding:0;border-radius:50%;font-size:19px;line-height:1;background:#000b;border-color:#fff3;display:none}
.card:hover .add,.card.in .add{display:block}.card.in .add{background:var(--ok);border-color:var(--ok);color:#fff}
.card .hv{position:absolute;right:6px;top:6px;font-size:14px;color:var(--red)}
/* preview */
#pv{flex:none;width:min(420px,42vw);border-left:1px solid var(--line);background:var(--pane);display:none;flex-direction:column;min-height:0}
#pv.on{display:flex}
#pvh{display:flex;align-items:center;gap:6px;padding:8px 10px;font-size:12px;color:var(--mute)}#pvh span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#stage{flex:1;min-height:120px;background:#000;display:flex;align-items:center;justify-content:center;position:relative}
#stage video,#stage img{max-width:100%;max-height:100%;display:block}#stage .msg{color:var(--mute);text-align:center;padding:14px}
#pvc{padding:10px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row .sp{flex:1}
.rng{font:12px ui-monospace,Menlo,monospace;color:var(--mute)}
#looks{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.lk{border:2px solid transparent;border-radius:7px;overflow:hidden;cursor:pointer;background:#0b0b0c;position:relative}
.lk.on{border-color:var(--acc)}.lk img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.lk b{position:absolute;left:0;right:0;bottom:0;font-size:9px;font-weight:500;background:#000a;padding:1px 3px;text-align:center;white-space:nowrap;overflow:hidden}
.lbl{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
/* dock */
#dock{flex:none;border-top:1px solid var(--line);background:var(--pane)}
#dh{display:flex;align-items:center;gap:8px;padding:8px 12px;overflow-x:auto}
#dh>*{flex:none}#dh .sp{flex:1}#dh select{background:var(--pane2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;max-width:190px}
#stat{color:var(--mute);font-size:12px}
#db{padding:0 12px 10px;display:flex;flex-direction:column;gap:8px}#dock.shut #db{display:none}
#strip{display:flex;gap:6px;overflow-x:auto;min-height:92px;align-items:stretch;padding:2px;border-radius:10px}
#strip.hot{outline:1px dashed var(--acc)}
.it{flex:none;width:72px;position:relative;border-radius:8px;overflow:hidden;background:#0b0b0c;border:2px solid transparent;cursor:grab}
.it.sel{border-color:var(--acc)}.it.drag{opacity:.35}
.it img{width:100%;height:68px;object-fit:cover;display:block;pointer-events:none}
.it .d{font-size:11px;text-align:center;padding:1px 0 2px;color:var(--mute);pointer-events:none}
.it .x{position:absolute;right:2px;top:2px;width:20px;height:20px;padding:0;border-radius:50%;font-size:12px;line-height:1;background:#000c;border-color:#fff3;display:none}
.it:hover .x{display:block}
.ins{flex:none;width:3px;border-radius:2px;background:var(--acc)}
#strip .hint{color:var(--mute);align-self:center;padding:0 12px}
#mrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
#wave{flex:1;min-width:160px;height:34px;border-radius:8px;background:#163a2b;border:1px solid #2f9e6b;position:relative;overflow:hidden;cursor:ew-resize}
#wave i{position:absolute;top:0;bottom:0;background-size:100% 100%;background-repeat:no-repeat;pointer-events:none;opacity:.9}
#wave b{position:absolute;left:8px;top:8px;font-weight:500;font-size:12px;text-shadow:0 1px 3px #000;pointer-events:none;white-space:nowrap}
label.ck{display:flex;gap:6px;align-items:center;color:var(--mute);font-size:12px;cursor:pointer}
/* overlays */
.pop{position:fixed;inset:0;background:#000a;z-index:50;display:none;align-items:center;justify-content:center;padding:16px}.pop.on{display:flex}
.box{background:var(--pane);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(520px,100%);display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
.box h3{margin:0;font-size:16px}.box input[type=text]{height:40px;border-radius:10px;background:var(--pane2);border:1px solid var(--line);padding:0 12px;width:100%}
.box video{width:100%;max-height:60vh;background:#000;border-radius:10px}.box .sm{color:var(--mute);font-size:12px;user-select:text;word-break:break-all}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#000e;border:1px solid var(--line);padding:9px 16px;border-radius:10px;display:none;z-index:90;max-width:86vw;text-align:center}
#dropz{position:fixed;inset:10px;border:3px dashed var(--acc);border-radius:18px;background:#000b;z-index:80;display:none;align-items:center;justify-content:center;font-size:20px;pointer-events:none}#dropz.on{display:flex}
#bar{height:3px;background:var(--acc);width:0;transition:width .3s}
.ghostdrag{position:fixed;z-index:95;pointer-events:none;width:60px;height:60px;border-radius:8px;overflow:hidden;box-shadow:0 8px 24px #000a;opacity:.9}.ghostdrag img{width:100%;height:100%;object-fit:cover}
@media (max-width:760px){body{overflow:auto;height:auto}#mid{flex-direction:column}#pv{width:100%;border-left:0;border-top:1px solid var(--line)}#stage{min-height:240px}#looks{grid-template-columns:repeat(3,1fr)}#res{overflow:visible}}
</style>
</head>
<body>
<div id="bar"></div>
<div id="top">
  <div id="sbox"><span class="ic">⌕</span><input id="q" placeholder="Search: keys, crowd, guitar, portrait…" autocomplete="off" spellcheck="false">
    <div class="btns"><button id="mic" title="Say what you're looking for">🎤</button><button id="askb" title="Ask Claude to find it or build the edit">✦</button></div></div>
  <div id="say"><span>✦</span><div class="tx" id="sayTx"></div><button class="ghost" id="sayUndo" style="display:none">Undo</button><button class="ghost" id="sayX">✕</button></div>
  <div id="chips"></div>
</div>
<div id="mid">
  <div id="res"><div id="grid"></div></div>
  <div id="pv">
    <div id="pvh"><span id="pvName"></span><button class="ghost" id="fav" title="Favourite">♡</button><button class="ghost" id="pvX" title="Close">✕</button></div>
    <div id="stage"></div>
    <div id="pvc">
      <div class="row" id="trim"></div>
      <div><div class="lbl" style="margin-bottom:5px">Look for the whole video</div><div id="looks"></div></div>
    </div>
  </div>
</div>
<div id="dock">
  <div id="dh">
    <button class="ghost" id="fold" title="Show or hide your edit">▾</button><b>Your edit</b>
    <select id="set" title="Switch edit"></select><button class="ghost" id="newSet" title="Start a new edit">＋ New</button>
    <span id="stat"></span><span class="sp"></span>
    <button id="bMusic">♪ Music</button>
    <button id="bBeat" title="Cut every shot on the beat of the music">Cut to the beat</button>
    <button id="bPlay">▶ Preview</button>
    <button class="go" id="bMake">Make video</button>
  </div>
  <div id="db">
    <div id="strip"></div>
    <div id="mrow"></div>
  </div>
</div>

<div class="pop" id="mpop"><div class="box"><h3>Add music</h3>
  <input type="text" id="murl" placeholder="Paste a link: YouTube, Spotify, SoundCloud, Bandcamp…">
  <div class="row"><button class="go" id="mget">Get song</button><button id="mfile">Choose a file</button><span class="sp"></span><button class="ghost" id="mx">Cancel</button></div>
  <div class="sm" id="mnote">The song is used to cut on the beat and to preview. It's left out of the finished file unless you tick “I have the rights”, so you can add it in Instagram or TikTok.</div></div></div>
<div class="pop" id="rpop"><div class="box" style="width:min(460px,100%)"><h3 id="rT">Your video</h3><video id="rV" controls playsinline></video><div class="sm" id="rN"></div>
  <div class="row"><span class="sp"></span><button id="rX">Close</button></div></div></div>
<div id="dropz">Drop to add to your library</div>
<div id="toast"></div>
<input type="file" id="fileIn" multiple style="display:none">
<audio id="mus" preload="auto"></audio>

<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mmss=t=>{t=Math.max(0,t||0);return Math.floor(t/60)+":"+String((t%60).toFixed(1)).padStart(4,"0")};
const store={get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let D={items:[],excluded:[]},P={},S={},LOOKS={looks:{},default:null},byId={};
let cur="",sel=null,ftype="",ftag="",ffav=false,aiIds=null,V=null,playing=null,undo=null,pend={},snapT=null,busy=0;
function toast(m,ms=3000){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",ms)}
function load(n){busy=Math.max(0,busy+n);$("bar").style.width=busy?"70%":"0"}
async function api(path,body){load(1);try{const r=await fetch(path,body!==undefined?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:{});
  let j;try{j=await r.json()}catch(e){throw new Error("The studio isn't answering ("+r.status+")")}if(!r.ok)throw new Error(j.error||r.status);return j}finally{load(-1)}}
const safe=f=>async(...a)=>{try{return await f(...a)}catch(e){console.error(e);toast(e.message||String(e),5000)}};
const today=()=>new Date().toISOString().slice(0,10);

const start=safe(async()=>{
  [D,P,S,LOOKS]=await Promise.all([api("/api/index"),api("/api/picks"),api("/api/sets"),api("/api/looks")]);
  reindex();document.title="Video Studio · "+D.project;
  const names=Object.keys(S),saved=store.get("vs-set:"+D.project,"");cur=names.includes(saved)?saved:(names.sort().reverse()[0]||"");
  if(store.get("vs-dock","open")=="shut")$("dock").classList.add("shut");
  chips();results();dock();tagStatus();
});
const HELPER=/release-check|\/grades\/|clip-picker|\/posters\/|\/proxies\//i;
function reindex(){D.items=D.items.filter(i=>!HELPER.test((i.path||"")+"/"+(i.name||"")));byId={};for(const i of D.items){byId[i.id]=i;const a=i.auto||{};
  i._t=[i.name,i.folder,i.category,(i.tags||[]).join(" "),i.notes,i.type,(a.instruments||[]).join(" "),(a.subjects||[]).join(" "),a.setting,a.desc].join(" ").toLowerCase()}}
// ---------- search ----------
function chips(){const ci={},cs={};for(const i of D.items){const a=i.auto;if(!a)continue;for(const t of a.instruments||[])ci[t]=(ci[t]||0)+1;for(const t of a.subjects||[])cs[t]=(cs[t]||0)+1}
  const top=(c,n,skip=[])=>Object.entries(c).filter(x=>!skip.includes(x[0])&&x[1]>1).sort((a,b)=>b[1]-a[1]).slice(0,n).map(x=>x[0]);
  const tags=[...top(ci,8,["microphone"]),...top(cs,8,["text or screenshot","poster or graphic"])];
  const T=[["","All"],["video","Video"],["photo","Photo"],["audio","Music"]];
  $("chips").innerHTML=T.map(([k,l])=>`<button class="chip t ${ftype==k&&(k||(!ftag&&!ffav&&!$("q").value&&shown()))?"on":""}" data-type="${k}">${l}</button>`).join("")+
   `<button class="chip t ${ffav?"on":""}" data-fav="1">♥</button>`+(tags.length?`<span class="sepv"></span>`:"")+
   tags.map(t=>`<button class="chip ${ftag==t?"on":""}" data-tag="${esc(t)}">${esc(t)}</button>`).join("")+`<span id="tagb"></span>`;
  $("chips").querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>{aiIds=null;if(b.dataset.type==""){ftype="";ftag="";ffav=false;$("q").value="";showAll=!showAll}else{ftype=ftype==b.dataset.type?"":b.dataset.type;showAll=false}chips();results()});
  $("chips").querySelector("[data-fav]").onclick=()=>{aiIds=null;ffav=!ffav;chips();results()};
  $("chips").querySelectorAll("[data-tag]").forEach(b=>b.onclick=()=>{aiIds=null;ftag=ftag==b.dataset.tag?"":b.dataset.tag;chips();results()});tagBanner()}
let showAll=false;const shown=()=>showAll;
function matches(){if(aiIds)return aiIds.map(id=>byId[id]).filter(Boolean);
  const words=$("q").value.toLowerCase().trim().split(/\s+/).filter(Boolean);
  if(!words.length&&!ftype&&!ftag&&!ffav&&!showAll)return null;
  let r=D.items.filter(i=>(!ftype||i.type==ftype)&&(!ffav||(i.rating||0)>=4)&&(!ftag||i._t.includes(ftag))&&words.every(w=>i._t.includes(w)));
  r.sort((a,b)=>((b.rating||0)>=4)-((a.rating||0)>=4)||(a.source!="local")-(b.source!="local")||(a.date<b.date?1:-1));return r}
function inEdit(id){return !!(cur&&P[cur]&&P[cur][id]&&P[cur][id].pick)}
function results(){const r=matches(),g=$("grid");
  if(r===null){g.innerHTML=`<div class="empty" style="grid-column:1/-1">Search for what you need, tap a tag, or press 🎤 and say it.</div>`;return}
  if(!r.length){g.innerHTML=`<div class="empty" style="grid-column:1/-1">Nothing matches. Try another word, or press ✦ to ask Claude.</div>`;return}
  const MAX=90;g.innerHTML=r.slice(0,MAX).map(i=>`<div class="card ${sel==i.id?"sel":""} ${inEdit(i.id)?"in":""} ${i.source!="local"?"dim":""}" data-id="${i.id}" title="${esc(i.name)}${i.auto?" · "+esc(i.auto.desc||""):""}">
   <div class="th">${i.thumb?`<img loading="lazy" src="/thumb/${i.id}.jpg" alt="">`:(i.type=="audio"?"♪":i.source!="local"?"☁":"▢")}</div>
   <span class="tg">${i.type=="video"?(i.duration?mmss(i.duration).replace(/\.\d$/,""):"video"):i.type=="audio"?"♪ music":"photo"}${i.source!="local"?" · "+esc(i.source):""}</span>
   ${(i.rating||0)>=4?'<span class="hv">♥</span>':""}
   ${i.source=="local"?`<button class="add" data-add="${i.id}" title="${inEdit(i.id)?"In your edit":i.type=="audio"?"Use as the music":"Add to your edit"}">${inEdit(i.id)?"✓":"+"}</button>`:""}
   <div class="nm">${esc(i.auto&&i.auto.desc?i.auto.desc:i.name)}</div></div>`).join("")+(r.length>MAX?`<div class="empty" style="grid-column:1/-1;padding:14px">${r.length-MAX} more. Add a word to narrow it down.</div>`:"");
  g.querySelectorAll(".card").forEach(c=>c.onclick=e=>{const a=e.target.closest("[data-add]");if(a){inEdit(a.dataset.add)?remove(a.dataset.add):add(a.dataset.add)}else open(c.dataset.id)})}
let qT=null;$("q").oninput=()=>{aiIds=null;showAll=false;clearTimeout(qT);qT=setTimeout(()=>{chips();results()},90)};
$("q").onkeydown=e=>{if(e.key=="Enter"){const r=matches();if($("q").value.trim()&&(!r||!r.length||e.metaKey))ask()}if(e.key=="Escape"){$("q").value="";aiIds=null;chips();results();$("q").blur()}};
// ---------- auto-tagging ----------
let TG=null;
async function tagStatus(){try{TG=await api("/api/autotag")}catch(e){return}tagBanner();if(TG.state=="running")setTimeout(async()=>{await tagStatus();if(TG.done%30<10){const d=await api("/api/index");for(const i of d.items)if(byId[i.id]&&i.auto&&!byId[i.id].auto){byId[i.id].auto=i.auto;const a=i.auto;byId[i.id]._t+=" "+[(a.instruments||[]).join(" "),(a.subjects||[]).join(" "),a.setting,a.desc].join(" ").toLowerCase()}chips()}},4000);
  else if(TG.state=="done"&&!tagStatus.done){tagStatus.done=1;D=await api("/api/index");reindex();chips();results()}}
function tagBanner(){const b=$("tagb");if(!b||!TG)return;const left=TG.taggable-TG.tagged;
  if(TG.state=="running")b.innerHTML=`<span class="chip" style="border-style:dashed">Looking at your clips… ${TG.tagged}/${TG.taggable}</span>`;
  else if(left>5)b.innerHTML=`<button class="chip" id="tagGo" style="border-style:dashed;color:var(--ai)">✦ Tag ${left} clips so search knows what's in them</button>`;else b.innerHTML="";
  if($("tagGo"))$("tagGo").onclick=safe(async()=>{await api("/api/autotag",{start:1});tagStatus.done=0;tagStatus()})}
// ---------- preview ----------
function open(id){const i=byId[id];if(!i)return;stopEdit();sel=id;$("pv").classList.add("on");$("pvName").textContent=i.auto&&i.auto.desc?i.auto.desc:i.name;$("pvName").title=i.name;
  document.querySelectorAll(".card").forEach(c=>c.classList.toggle("sel",c.dataset.id==id));document.querySelectorAll(".it").forEach(c=>c.classList.toggle("sel",c.dataset.id==id));
  const st=$("stage");st.innerHTML="";V=null;
  if(i.source!="local")st.innerHTML=`<div class="msg">This one is in ${esc(i.source)}.<br><a href="${esc(i.url||"#")}" target="_blank" rel="noopener" style="color:var(--acc)">Open it there</a><br><br>Ask Claude to bring it in before you can cut it.</div>`;
  else if(i.type=="photo")st.innerHTML=`<img src="${i.play}" alt="">`;
  else{V=document.createElement(i.type=="audio"?"audio":"video");V.dataset.id=id;V.controls=true;V.playsInline=true;V.preload="auto";V.src=i.play;st.appendChild(V);
    if(i.play.startsWith("/proxy"))st.insertAdjacentHTML("beforeend",`<div class="msg" id="pmsg" style="position:absolute">Getting this clip ready…</div>`);
    V.onloadeddata=()=>{const m=$("pmsg");if(m)m.remove();const p=range(id);if(p.in)V.currentTime=p.in};
    V.onerror=()=>{if(V&&V.dataset.id==id){const m=$("pmsg");if(m)m.remove();st.insertAdjacentHTML("beforeend",`<div class="msg" style="position:absolute">This file won't play here. It can still go in your edit.</div>`)}}}
  fav();trim();looks()}
$("pvX").onclick=()=>{stopEdit();$("pv").classList.remove("on");sel=null;$("stage").innerHTML="";V=null;document.querySelectorAll(".sel").forEach(c=>c.classList.remove("sel"))};
function fav(){const i=byId[sel];$("fav").textContent=(i.rating||0)>=4?"♥":"♡";$("fav").style.color=(i.rating||0)>=4?"var(--red)":""}

  const cl=got.filter(g=>g[0]=="clip").map(g=>g[1].id);if(cl.length){aiIds=cl;chips();results();toast(`Added ${cl.length} file${cl.length>1?"s":""}. Press + to put them in your edit.`,3500)}}
// ---------- keys ----------
document.addEventListener("keydown",e=>{const tg=e.target&&e.target.closest?e.target:document.body;
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()=="f"){e.preventDefault();$("q").focus();$("q").select();return}
  if(e.key=="Escape"){document.querySelectorAll(".pop.on").forEach(p=>p.classList.remove("on"));stopEdit();return}
  if(tg.closest("input,select,textarea")||e.metaKey||e.ctrlKey)return;if(tg.tagName=="BUTTON")tg.blur();
  if(e.key==" "){e.preventDefault();if(e.shiftKey)playEdit();else if(V&&!playing)V.paused?V.play().catch(()=>{}):V.pause()}
  else if(e.key=="/"){e.preventDefault();$("q").focus()}});
document.addEventListener("mouseup",e=>{const b=e.target.closest&&e.target.closest("button");if(b)b.blur()});
window.addEventListener("error",e=>toast("Something went wrong: "+e.message,5000));
start();
</script>
</body>
